# Precomputes public/data/all-time-h2h.json (every manager pair's all-time
# head-to-head, across every season) so the Home screen's Rivalry Game cards
# read one small static file instead of assembling it live in the browser —
# see scripts/generate-all-time-h2h.ts for why (that live version stalled
# the Home screen on a cold cache).
name: all-time-h2h-snapshot
on:
  schedule: [{ cron: '17 4 * * *' }]   # daily, 04:17 UTC — well clear of :00/:30
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/generate-all-time-h2h.ts
      - name: Commit
        run: |
          git config user.name  'status-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add public/data/all-time-h2h.json
          git commit -m 'all-time h2h snapshot' || echo 'no changes'
          git push
